plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace 'com.tvremoteime.next'
    compileSdk libs.versions.compileSdk.get().toInteger()

    // 正式签名配置（07 文档 3.1）：
    // CI 由 release workflow 注入 keystore.properties（来自 Actions secrets）；
    // 本地无该文件时回落 debug 签名，保证 assembleRelease 始终可跑（自用场景）。
    def keystorePropsFile = rootProject.file('keystore.properties')
    def hasReleaseKeystore = keystorePropsFile.exists()
    def keystoreProps = new Properties()
    if (hasReleaseKeystore) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.tvremoteime.next"
        minSdk libs.versions.minSdk.get().toInteger()
        targetSdk libs.versions.targetSdk.get().toInteger()
        versionCode 300
        versionName "3.0.0"
        // minSdk 19 < 21 必须 legacy multidex（方法数 68k 超限）
        multiDexEnabled true
        // 仅 32 位（03 文档决策）：NDK 不在 CI 引入，v7a so 全部随包
        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 有正式 keystore 用正式签名；否则回落 debug（本地自用，D12）
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation project(':adb-lib')
    implementation project(':ijkplayer')
    implementation project(':DroidDLNA')

    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.material
    implementation libs.nanohttpd
    implementation libs.zxing.core
    implementation libs.kotlinx.coroutines.android
    implementation "androidx.multidex:multidex:2.0.1"

    testImplementation libs.junit
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
