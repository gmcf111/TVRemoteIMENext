							<svg class="md-ic hint-icon" viewBox="0 -960 960 960" aria-hidden="true"><path d="M419-80q-28 0-52.5-12T325-126L124-381q-8-9-7-21.5t9-20.5q20-21 48-25t52 11l74 45v-328q0-17 11.5-28.5T340-760q17 0 29 11.5t12 28.5v400q0 23-20.5 34.5T320-286l-36-22 104 133q6 7 14 11t17 4h221q33 0 56.5-23.5T720-240v-160q0-17-11.5-28.5T680-440H501q-17 0-28.5-11.5T461-480q0-17 11.5-28.5T501-520h179q50 0 85 35t35 85v160q0 66-47 113T640-80H419Zm83-260Zm-23-260q-17 0-28.5-11.5T439-640q0-2 5-20 8-14 12-28.5t4-31.5q0-50-35-85t-85-35q-50 0-85 35t-35 85q0 17 4 31.5t12 28.5q3 5 4 10t1 10q0 17-11 28.5T202-600q-11 0-20.5-6T167-621q-13-22-20-47t-7-52q0-83 58.5-141.5T340-920q83 0 141.5 58.5T540-720q0 27-7 52t-20 47q-5 9-14 15t-20 6Z"/></svg>
							<span class="hint-text">滑动控制鼠标<br/>单击=左键 | 双指=右键</span>
						</div>
					</div>
					<div class="mouse-buttons">
						<button id="mouse-left" class="mouse-btn" aria-label="左键">左键</button>
						<button id="mouse-longclick" class="mouse-btn" aria-label="长按">长按</button>
						<button id="mouse-right" class="mouse-btn" aria-label="右键">右键</button>
					</div>
					<div class="swipe-buttons">
						<button id="swipe-up" class="swipe-btn" aria-label="上划">↑ 上划</button>
						<button id="swipe-down" class="swipe-btn" aria-label="下划">↓ 下划</button>
					</div>
					<div class="touchpad-settings">
						<label class="sensitivity-label">
							<span>灵敏度: <strong id="sensitivity-value">1.5</strong></span>
							<input type="range" id="sensitivity" min="0.5" max="3" step="0.1" value="1.5" aria-label="鼠标灵敏度">
						</label>
						<label class="sensitivity-label">
							<span>滑动距离: <strong id="swipe-distance-value">300</strong>px</span>
							<input type="range" id="swipe-distance" min="100" max="800" step="50" value="300" aria-label="滑动距离">
						</label>
						<label class="sensitivity-label">
							<span>长按时间: <strong id="longpress-duration-value">600</strong>ms</span>
							<input type="range" id="longpress-duration" min="300" max="1500" step="100" value="600" aria-label="长按时间">
						</label>
					</div>
					<div class="touchpad-status">
						<span id="mouse-pos" class="status-item">位置: --</span>
						<span id="adb-status" class="status-item">ADB: 检测中...</span>
					</div>
				</div>
			</section>
		</div>

		<!-- Tab Content: App Management -->
		<div class="tab-content hidden" data-tab="app">
			<section class="app-panel">
				<div class="app-toolbar">
					<button type="button" class="btn-secondary" id="showSettings">
						<svg class="md-ic" viewBox="0 -960 960 960" aria-hidden="true"><path d="M433-80q-27 0-46.5-18T363-142l-9-66q-13-5-24.5-12T307-235l-62 26q-25 11-50 2t-39-32l-47-82q-14-23-8-49t27-43l53-40q-1-7-1-13.5v-27q0-6.5 1-13.5l-53-40q-21-17-27-43t8-49l47-82q14-23 39-32t50 2l62 26q11-8 23-15t24-12l9-66q4-26 23.5-44t46.5-18h94q27 0 46.5 18t23.5 44l9 66q13 5 24.5 12t22.5 15l62-26q25-11 50-2t39 32l47 82q14 23 8 49t-27 43l-53 40q1 7 1 13.5v27q0 6.5-2 13.5l53 40q21 17 27 43t-8 49l-48 82q-14 23-39 32t-50-2l-60-26q-11 8-23 15t-24 12l-9 66q-4 26-23.5 44T527-80h-94Zm7-80h79l14-106q31-8 57.5-23.5T639-327l99 41 39-68-86-65q5-14 7-29.5t2-31.5q0-16-2-31.5t-7-29.5l86-65-39-68-99 42q-22-23-48.5-38.5T533-694l-13-106h-79l-14 106q-31 8-57.5 23.5T321-633l-99-41-39 68 86 64q-5 15-7 30t-2 32q0 16 2 31t7 30l-86 65 39 68 99-42q22 23 48.5 38.5T427-266l13 106Zm42-180q58 0 99-41t41-99q0-58-41-99t-99-41q-59 0-99.5 41T342-480q0 58 40.5 99t99.5 41Zm-2-140Z"/></svg>
						<span>系统设置</span>
					</button>
					<label class="checkbox-label">
						<input type="checkbox" id="cbListSystem">
						<span>显示系统应用</span>
					</label>
					<label class="checkbox-label danger">
						<input type="checkbox" id="cbUninstall">
						<span>卸载应用</span>
					</label>
				</div>
				<div class="app-list"></div>
			</section>

			<section class="upload-panel">
				<div class="upload-wrapper">
					<label class="file-btn" for="upfileApp">
						<svg class="md-ic" viewBox="0 -960 960 960" aria-hidden="true"><path d="M240-160q-33 0-56.5-23.5T160-240v-80q0-17 11.5-28.5T200-360q17 0 28.5 11.5T240-320v80h480v-80q0-17 11.5-28.5T760-360q17 0 28.5 11.5T800-320v80q0 33-23.5 56.5T720-160H240Zm200-486-75 75q-12 12-28.5 11.5T308-572q-11-12-11.5-28t11.5-28l144-144q6-6 13-8.5t15-2.5q8 0 15 2.5t13 8.5l144 144q12 12 11.5 28T652-572q-12 12-28.5 12.5T595-571l-75-75v286q0 17-11.5 28.5T480-320q-17 0-28.5-11.5T440-360v-286Z"/></svg>
						<span>上传APK</span>
					</label>
					<input type="file" id="upfileApp" aria-label="选择APK文件">
					<span class="file-name-hint" id="upfileApp-name">未选择文件</span>
					<div class="progress-wrap">
						<div class="progress-bar">
						    <div class="progress-fill" id="processbarApp"></div>
						</div>
						<span class="progress-text">0%</span>
					</div>
				</div>
			</section>
		</div>

		<!-- Tab Content: File Management -->
		<div class="tab-content hidden" data-tab="file">
			<section class="file-panel">
				<div class="file-toolbar">
					<div class="file-upload">
						<label class="file-btn" for="upfile2">
							<svg class="md-ic" viewBox="0 -960 960 960" aria-hidden="true"><path d="M240-160q-33 0-56.5-23.5T160-240v-80q0-17 11.5-28.5T200-360q17 0 28.5 11.5T240-320v80h480v-80q0-17 11.5-28.5T760-360q17 0 28.5 11.5T800-320v80q0 33-23.5 56.5T720-160H240Zm200-486-75 75q-12 12-28.5 11.5T308-572q-11-12-11.5-28t11.5-28l144-144q6-6 13-8.5t15-2.5q8 0 15 2.5t13 8.5l144 144q12 12 11.5 28T652-572q-12 12-28.5 12.5T595-571l-75-75v286q0 17-11.5 28.5T480-320q-17 0-28.5-11.5T440-360v-286Z"/></svg>
							<span>上传文件</span>
						</label>
						<input type="file" id="upfile2" aria-label="选择文件">
						<div class="progress-wrap">
							<div class="progress-bar compact">
								<div class="progress-fill" id="processbar2"></div>
							</div>
							<span class="progress-text">0%</span>
						</div>
					</div>
					<label class="checkbox-label">
						<input type="checkbox" id="cbFileSelect">
						<span>选择</span>
					</label>
				</div>
				<div class="file-operations hidden">
					<div class="file-oper-items"></div>
					<div class="file-oper-actions">
						<button type="button" class="btn-secondary" id="btnCopy" onclick="postFileAction('copy');">复制</button>
						<button type="button" class="btn-secondary" id="btnCut" onclick="postFileAction('cut');">剪切</button>
						<button type="button" class="btn-danger" id="btnDelete" onclick="postFileAction('delete');">删除</button>
					</div>
				</div>
				<div class="file-browser">
					<div class="file-info" id="diskSpace"></div>
					<div class="current-path" id="curPath"></div>
					<div class="file-list"></div>
				</div>
			</section>
		</div>

		<!-- Tab Content: Video Streaming -->
		<div class="tab-content hidden" data-tab="video">
			<section class="video-panel">
				<div class="video-toolbar">
					<label class="input-label">
						每次快进
						<input type="text" id="speedInterval" maxlength="3" value="5" class="input-small" aria-label="快进秒数">
						秒
					</label>
					<label class="checkbox-label">
						<input type="checkbox" id="playUseSystem">
						<span>调用系统播放器</span>
					</label>
					<button type="button" class="btn-warning" id="stopPlay">停止边下边播</button>
				</div>

				<div class="video-input">
					<div class="input-group">
						<span class="input-label">网络视频：</span>
						<a href="javascript:$('#playUrl').val('');" class="link-small">[清空地址]</a>
					</div>
					<div class="input-row">
						<input type="text" id="playUrl" placeholder="http/ftp/thunder/ed2k/rtmp/mms" aria-label="视频地址">
						<button type="button" class="btn-primary" id="btnPlay">远程播放</button>
					</div>
				</div>

				<div class="torrent-input">
					<span class="input-label">种子视频：</span>
					<label class="file-btn" for="upfile3">
						<svg class="md-ic" viewBox="0 -960 960 960" aria-hidden="true"><path d="M240-160q-33 0-56.5-23.5T160-240v-80q0-17 11.5-28.5T200-360q17 0 28.5 11.5T240-320v80h480v-80q0-17 11.5-28.5T760-360q17 0 28.5 11.5T800-320v80q0 33-23.5 56.5T720-160H240Zm200-486-75 75q-12 12-28.5 11.5T308-572q-11-12-11.5-28t11.5-28l144-144q6-6 13-8.5t15-2.5q8 0 15 2.5t13 8.5l144 144q12 12 11.5 28T652-572q-12 12-28.5 12.5T595-571l-75-75v286q0 17-11.5 28.5T480-320q-17 0-28.5-11.5T440-360v-286Z"/></svg>
						<span>上传种子</span>
					</label>
					<input type="file" id="upfile3" aria-label="选择种子文件">
					<select id="torrentItems" class="select-input" aria-label="选择视频文件"></select>
					<button type="button" class="btn-primary" id="btnPlayTorrent">开始播放</button>
				</div>

				<div class="tv-section">
					<div class="tv-header">
						<span class="tv-title">电视节目：</span>
						<span class="tv-hint">
							需要更改直播源？<a href="#" id="btnShowTVEdit" class="link-primary">点击这里</a>
							<label class="file-btn file-btn-sm" for="upfileTV">
								<svg class="md-ic" viewBox="0 -960 960 960" aria-hidden="true"><path d="M240-160q-33 0-56.5-23.5T160-240v-80q0-17 11.5-28.5T200-360q17 0 28.5 11.5T240-320v80h480v-80q0-17 11.5-28.5T760-360q17 0 28.5 11.5T800-320v80q0 33-23.5 56.5T720-160H240Zm200-486-75 75q-12 12-28.5 11.5T308-572q-11-12-11.5-28t11.5-28l144-144q6-6 13-8.5t15-2.5q8 0 15 2.5t13 8.5l144 144q12 12 11.5 28T652-572q-12 12-28.5 12.5T595-571l-75-75v286q0 17-11.5 28.5T480-320q-17 0-28.5-11.5T440-360v-286Z"/></svg>
								<span>上传直播源</span>
							</label>
							<input type="file" id="upfileTV" accept=".txt,.ini" title="直播源文件（ini 格式：[分组] 名称=地址）" aria-label="选择直播源文件">
						</span>
					</div>
					<div class="tv-items"></div>
				</div>

				<div class="tv-editor hidden">
					<textarea id="tvData" class="editor-textarea" placeholder="编辑直播源..." aria-label="直播源编辑器"></textarea>
					<div class="editor-actions">
						<button type="button" class="btn-primary" id="btnTVEdit">修改</button>
						<button type="button" class="btn-secondary" id="btnTVCancel">取消</button>
					</div>
				</div>
			</section>
		</div>
	</div>

	<script src="/jquery_min.js"></script>
	<script src="/ime_core.js"></script>
</body>
</html>
