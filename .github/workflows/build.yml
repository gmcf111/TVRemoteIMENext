name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 预装 Android SDK（platforms;android-35 + build-tools），无需额外 setup

      - name: Build debug APK
        run: ./gradlew assembleDebug lintDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVRemoteIMENext-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION_CODE=$(grep 'versionCode ' app/build.gradle | sed 's/[^0-9]//g' | head -1)
          cp app/build/outputs/apk/debug/app-debug.apk "TVRemoteIMENext-v${TAG}-armeabi-v7a-debug.apk"
          cat > version.json <<EOF
          {
            "versionName": "${TAG}",
            "versionCode": ${VERSION_CODE},
            "installAPK": "https://github.com/gmcf111/TVRemoteIMENext/releases/download/v${TAG}/TVRemoteIMENext-v${TAG}-armeabi-v7a-debug.apk",
            "message": "TVRemoteIMENext v${TAG}",
            "forced": false
          }
          EOF
          cat version.json

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            TVRemoteIMENext-v*-armeabi-v7a-debug.apk
            version.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
