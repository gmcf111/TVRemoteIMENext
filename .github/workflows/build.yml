name: debug build

# 日常 debug CI（正式版出包见 release.yml）
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 预装 Android SDK（platforms;android-35 + build-tools），无需额外 setup

      - name: Warm up Gradle distribution
        run: |
          ok=""
          for i in 1 2 3 4; do
            if ./gradlew --version; then ok=1; break; fi
            echo "::warning::Gradle distribution download failed (attempt $i), retrying..."
            sleep 20
          done
          [ -n "$ok" ] || { echo "::error::Gradle distribution download failed after 4 attempts"; exit 1; }

      - name: Build debug APK
        run: ./gradlew assembleDebug lintDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVRemoteIMENext-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
