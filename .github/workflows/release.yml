name: release build

# 正式版构建（07 文档 3.1 / D12）：签名后出 APK + GitHub Release
# - push tag v*       → 自动出正式版
# - workflow_dispatch → 手动出包（可选填 tag，留空则按当前分支构建，不发 Release）

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '版本 tag（如 v3.0.0），留空则只构建产物、不创建 Release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 预装 Android SDK（platforms;android-35 + build-tools），无需额外 setup

      - name: Warm up Gradle distribution
        run: |
          # wrapper 分发源为镜像，网络抖动时重试（download 失败与构建失败区分开）
          ok=""
          for i in 1 2 3 4; do
            if ./gradlew --version; then ok=1; break; fi
            echo "::warning::Gradle distribution download failed (attempt $i), retrying..."
            sleep 20
          done
          [ -n "$ok" ] || { echo "::error::Gradle distribution download failed after 4 attempts"; exit 1; }

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # 单引号 heredoc：避免密码里的 $ 等特殊字符被 shell 展开
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<'EOF'
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          ls -l release.keystore
          # 别把密码打进日志
          sed 's/Password=.*/Password=***/' keystore.properties

      - name: Build release APK
        run: ./gradlew assembleRelease lintRelease --stacktrace

      - name: Verify APK signature
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(ls "$SDK/build-tools" | sort -V | tail -1)
          APK=app/build/outputs/apk/release/app-release.apk
          "$SDK/build-tools/$BT/apksigner" verify --print-certs "$APK"
          ls -lh "$APK"

      - name: Prepare release assets
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        run: |
          TAG="${{ inputs.tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          VERSION_CODE=$(grep 'versionCode ' app/build.gradle | sed 's/[^0-9]//g' | head -1)
          ASSET="TVRemoteIMENext-v${VER}-armeabi-v7a-release.apk"
          cp app/build/outputs/apk/release/app-release.apk "$ASSET"
          cat > version.json <<EOF
          {
            "versionName": "${VER}",
            "versionCode": ${VERSION_CODE},
            "installAPK": "https://github.com/gmcf111/TVRemoteIMENext/releases/download/${TAG}/${ASSET}",
            "message": "TVRemoteIMENext v${VER}",
            "forced": false
          }
          EOF
          cat version.json

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          files: |
            TVRemoteIMENext-v*-armeabi-v7a-release.apk
            version.json
          generate_release_notes: true
          body: |
            ## TVRemoteIMENext 正式版

            - 32 位 armeabi-v7a，minSdk 19（Android 4.4+）
            - 已使用 release 签名，与 debug 版签名不同，覆盖安装需先卸载 debug 版
            - 源码遵循 GPL v2：https://github.com/gmcf111/TVRemoteIMENext
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 手动出包（未指定 tag）时保留 artifact
      - name: Upload APK artifact
        if: startsWith(github.ref, 'refs/tags/v') == false && inputs.tag == ''
        uses: actions/upload-artifact@v4
        with:
          name: TVRemoteIMENext-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7
